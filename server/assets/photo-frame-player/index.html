<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>HomeBrain Photo Frame</title>
  <link rel="stylesheet" href="player.css">
  <script src="security.js" defer></script>
  <script src="player.js" defer></script>
</head>
<body>
  <main id="screen" aria-label="HomeBrain photo frame">
    <div id="canvas">
      <div id="photo-a" class="photo"></div>
      <div id="photo-b" class="photo"></div>
      <div id="empty"><span>HOMEBRAIN</span><p>Add photos from the HomeBrain app</p></div>
      <div id="overlays"></div>
    </div>
    <div id="connection" role="status" hidden></div>
    <div id="sleep" hidden></div>
    <button id="security-launcher" type="button" class="security-button" hidden>Security</button>
    <div id="security-modal" hidden>
      <section id="security-panel" role="dialog" aria-modal="true" aria-labelledby="security-title" tabindex="-1">
        <h2 id="security-title">Security</h2>
        <p id="security-preview" hidden>Preview only · no alarm commands are sent</p>
        <p id="security-state" role="status"></p>
        <p id="security-message" role="alert"></p>
        <div id="security-actions">
          <button id="security-arm-stay" type="button" class="security-button">Arm Stay</button>
          <button id="security-arm-away" type="button" class="security-button">Arm Away</button>
          <button id="security-disarm" type="button" class="security-button">Disarm</button>
        </div>
        <div id="security-confirm" hidden>
          <p id="security-action-title"></p>
          <div id="security-pin" hidden>
            <output id="security-pin-dots" aria-label="PIN length"></output>
            <div id="security-keypad"></div>
          </div>
          <button id="security-submit" type="button" class="security-button security-primary">Confirm</button>
        </div>
        <button id="security-cancel" type="button" class="security-button">Close</button>
      </section>
    </div>
  </main>
  <form id="pairing" hidden>
    <h1>HomeBrain Photo Frame</h1>
    <p>In HomeBrain, open Photo Frames, select this frame, and create a pairing link. Paste it here.</p>
    <label for="pairing-link">Pairing link</label>
    <input id="pairing-link" type="url" required autocomplete="off" spellcheck="false">
    <button type="submit">Connect frame</button>
    <p id="pairing-message" role="alert"></p>
  </form>
</body>
</html>
