name: Final audit evidence

on:
  push:
    branches: [audit/final-evidence-20260910]
    paths: [.github/workflows/final-audit-evidence.yml]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify merge, exact source tree and post-merge checks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'
          root.mkdir()
          repo = os.environ['GH_REPO']
          merged = 'd37df89c910526684ec39f453202fc5cef470fcc'
          head = '2b294e85ff2594b92bf6e7253f0728b1ef827628'
          def read(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{endpoint}'], timeout=60))
          def save(name, value):
              (root/name).write_text(json.dumps(value, indent=2))
          pr = read('pulls/676')
          save('pull-request.json', pr)
          assert pr['merged'] is True and pr['merge_commit_sha'] == merged
          assert pr['head']['sha'] == head
          main = read('branches/main')
          save('main.json', main)
          assert main['commit']['sha'] == merged
          before, after = read(f'git/commits/{head}'), read(f'git/commits/{merged}')
          assert before['tree']['sha'] == after['tree']['sha'], 'Merged source differs from tested source'
          expected = {'Regression tests', 'npm-audit', 'secret-scan', 'codeql'}
          selected = {}
          for attempt in range(60):
              response = read(f'actions/runs?head_sha={merged}&event=push&per_page=100')
              selected = {r['name']: r for r in response['workflow_runs'] if r['name'] in expected}
              save('post-merge-runs.json', response)
              if set(selected) == expected and all(r['status'] == 'completed' for r in selected.values()):
                  break
              time.sleep(5)
          assert set(selected) == expected, 'A required workflow did not start'
          assert all(r['head_sha'] == merged and r['head_branch'] == 'main' for r in selected.values())
          assert all(r['conclusion'] == 'success' for r in selected.values()), 'Post-merge checks are not all successful'
          checks = read(f'commits/{merged}/check-runs?per_page=100')
          save('post-merge-checks.json', checks)
          summary = {'repository': repo, 'pull_request': 676, 'merged': True, 'merge_commit': merged, 'tested_pr_head': head, 'same_source_tree': True, 'changed_files': pr['changed_files'], 'runs': {}, 'test_and_warning_lines': {}}
          for name, run in selected.items():
              summary['runs'][name] = {key: run[key] for key in ['id', 'head_sha', 'status', 'conclusion', 'html_url']}
              if name not in ('Regression tests', 'npm-audit'):
                  continue
              archive_path = root/f"{run['id']}.zip"
              with archive_path.open('wb') as output:
                  subprocess.run(['gh', 'api', f"repos/{repo}/actions/runs/{run['id']}/logs"], stdout=output, check=True, timeout=60)
              with zipfile.ZipFile(archive_path) as archive:
                  for entry in archive.infolist():
                      if '/' in entry.filename or not entry.filename.endswith('.txt'):
                          continue
                      text = re.sub(r'\x1b\[[0-9;]*m', '', archive.read(entry).decode('utf8', errors='replace'))
                      summary['test_and_warning_lines'][entry.filename] = [line for line in text.splitlines() if re.search(r'# (tests|pass|fail|skipped) \d|\d+ passed|Ran \d+ tests|npm warn|warning:|DeprecationWarning|PRE-EXISTING EXCEPTION|no unaccepted|Dynamic console format|built in', line, re.I)]
          save('summary.json', summary)
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verified-main-audit-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: error
