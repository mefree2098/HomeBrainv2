name: Audit workbench

on:
  push:
    branches: [audit/security-quality-20260910]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify baseline and apply reviewed patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = d5952ed40948c0a30d173bc8d933c93755db4a72
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          patch = lzma.decompress(pathlib.Path('.audit/security-quality.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '1b842f1ec5f3e66a6e0c8130b9808e766a843cd4c19be24f8bfe66275fc4cfdd'
          pathlib.Path('/tmp/homebrain-reviewed.patch').write_bytes(patch)
          PY
          git apply --check --index --unidiff-zero /tmp/homebrain-reviewed.patch
          git apply --index --unidiff-zero --whitespace=error /tmp/homebrain-reviewed.patch
      - name: Resolve only targeted compatible security updates
        shell: bash
        run: |
          npm --prefix server update hono --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix broker update qs --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix client install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm view adm-zip version dist-tags --json > "$RUNNER_TEMP/adm-zip-release.json"
          git diff --name-only > "$RUNNER_TEMP/lockfile-paths.txt"
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          allowed = {'server/package-lock.json', 'broker/package-lock.json', 'client/package-lock.json'}
          assert changed <= allowed, f'Unexpected dependency changes: {changed - allowed}'
          PY
          git add server/package-lock.json broker/package-lock.json client/package-lock.json
          git diff --cached --check
      - name: Commit isolated audit changes and remove temporary workbench
        id: commit
        shell: bash
        run: |
          git rm .audit/security-quality.patch.xz .github/workflows/audit-workbench.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: harden network and authentication boundaries, downloads, streams and regression gates'
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show --stat HEAD > "$RUNNER_TEMP/change-stat.txt"
          git archive --format=tar HEAD -o "$RUNNER_TEMP/homebrain-candidate.tar"
      - name: Publish only the audit branch without force
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          test "$GITHUB_REF" = refs/heads/audit/security-quality-20260910
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f' push origin HEAD:refs/heads/audit/security-quality-20260910
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-candidate
          path: |
            ${{ runner.temp }}/homebrain-candidate.tar
            ${{ runner.temp }}/adm-zip-release.json
            ${{ runner.temp }}/change-stat.txt
          retention-days: 7
          if-no-files-found: error
  ios-build:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Build unchanged iOS and watchOS simulator targets without signing
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -project HomeBrainApp/HomeBrainApp.xcodeproj -scheme HomeBrainApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-ios-build
          path: ${{ runner.temp }}/ios-build.log
          retention-days: 7
  typescript-baseline:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install client dependencies
        run: npm --prefix client ci --no-audit --no-fund
      - name: Compare baseline and candidate TypeScript diagnostics
        shell: bash
        run: |
          git worktree add "$RUNNER_TEMP/base" 1823f6885c912c179c7a5f4067e9aed6fe296d30
          ln -s "$GITHUB_WORKSPACE/client/node_modules" "$RUNNER_TEMP/base/client/node_modules"
          python3 - <<'PY'
          import collections, json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          command = [str(root/'client/node_modules/.bin/tsc'), '-p', 'tsconfig.app.json', '--noEmit', '--pretty', 'false']
          results = {}
          for name, cwd in [('baseline', temp/'base/client'), ('candidate', root/'client')]:
              result = subprocess.run(command, cwd=cwd, text=True, capture_output=True)
              (temp/f'typescript-{name}.log').write_text(result.stdout + result.stderr)
              assert result.returncode in (0, 2), f'Compiler failed unexpectedly: {result.returncode}'
              diagnostics = re.findall(r'^(.*?)\(\d+,\d+\): (error TS\d+:.*)$', result.stdout, re.M)
              results[name] = collections.Counter(f'{file}: {message}' for file, message in diagnostics)
          added = results['candidate'] - results['baseline']
          summary = {'baseline': sum(results['baseline'].values()), 'candidate': sum(results['candidate'].values()), 'added': dict(added)}
          (temp/'typescript-comparison.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          # Diagnostics are evidence, not a claim that this legacy tree type-checks.
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-typescript
          path: |
            ${{ runner.temp }}/typescript-*.log
            ${{ runner.temp }}/typescript-comparison.json
          retention-days: 7
