name: Siri native

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: siri-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select installed Apple SDK
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version
      - name: Test shared Siri transport and identity rules
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/siri-evidence"
          swiftc -warnings-as-errors -default-isolation MainActor -parse-as-library \
            shared/apple/HomeBrainSiriModels.swift shared/apple/HomeBrainSiriClient.swift \
            scripts/tests/siri-core-tests.swift -o "$RUNNER_TEMP/siri-core-tests"
          "$RUNNER_TEMP/siri-core-tests" | tee "$RUNNER_TEMP/siri-evidence/core-tests.txt"
      - name: Build iOS app and embedded Apple Watch app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project HomeBrainApp/HomeBrainApp.xcodeproj -scheme HomeBrainApp \
            -configuration '${{ matrix.configuration }}' -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/SiriIOS" \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build \
            2>&1 | tee "$RUNNER_TEMP/siri-evidence/ios-build.txt"
      - name: Build standalone Watch scheme
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project HomeBrainApp/HomeBrainApp.xcodeproj -scheme 'HomeBrainWatch Watch App' \
            -configuration '${{ matrix.configuration }}' -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath "$RUNNER_TEMP/SiriWatch" \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build \
            2>&1 | tee "$RUNNER_TEMP/siri-evidence/watch-build.txt"
      - name: Verify compiled Siri metadata in both app products
        run: |
          python3 scripts/check-siri-metadata.py "$RUNNER_TEMP/SiriIOS/Build/Products" "$RUNNER_TEMP/SiriWatch/Build/Products" | tee "$RUNNER_TEMP/siri-evidence/metadata.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: siri-native-${{ matrix.configuration }}
          path: ${{ runner.temp }}/siri-evidence
          retention-days: 14
          if-no-files-found: warn
