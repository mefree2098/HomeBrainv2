name: Apple Home workbench
on:
  push:
    branches: [audit/apple-home-workbench-20260910]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: f1ff47b89b83657a65ef419be1b4820df6ef4f4e
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify required bridge dependency and export locked installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cd server
          npm install --save-exact @homebridge/hap-nodejs@2.2.3 --ignore-scripts --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/evidence/install.txt"
          node -e 'const hap=require("@homebridge/hap-nodejs"); if(!hap.Bridge) process.exit(1); console.log("HAP runtime loaded")'
          npm audit --json > "$RUNNER_TEMP/evidence/audit.json"
          cp package.json package-lock.json "$RUNNER_TEMP/evidence/"
          tar -czf "$RUNNER_TEMP/evidence/node_modules.tar.gz" node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: apple-home-required-dependency
          path: ${{ runner.temp }}/evidence
          retention-days: 7
