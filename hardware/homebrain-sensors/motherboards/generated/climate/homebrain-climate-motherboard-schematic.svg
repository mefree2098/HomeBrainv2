<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1150" viewBox="0 0 1900 1150">
<title>HomeBrain Climate Motherboard net contract</title>
<metadata>{"artifact": "dedicated-motherboard-schematic", "board": "climate", "nets": ["A0", "D2", "D3", "GND", "BAT+"]}</metadata>
<rect width="100%" height="100%" fill="#f4f7fb"/>
<text x="60" y="60" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="900" fill="#15243b" text-anchor="start">HOMEBRAIN CLIMATE MOTHERBOARD — V1.2-DRAFT VERIFIED NET CONTRACT</text>
<text x="60" y="102" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="650" fill="#526d89" text-anchor="start">Every row below is implemented as PCB copper. NC pads are drilled for mechanical mounting only and have no copper route.</text>
<rect x="60" y="170" width="1780" height="82" rx="14" fill="#ffffff" stroke="#ced8e5" stroke-width="2.0" />
<rect x="60" y="170" width="14" height="82" rx="7" fill="#28364b"/>
<text x="96" y="204" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" fill="#28364b" text-anchor="start">GND</text>
<text x="240" y="204" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="750" fill="#15243b" text-anchor="start">U1 GND   →   J1 -   →   J2 BAT-   →   R2 GND   →   XB1 BAT-</text>
<text x="240" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="650" fill="#5e7187" text-anchor="start">Both copper layers are stitched GND planes; mounting holes also connect to GND.</text>
<rect x="60" y="272" width="1780" height="82" rx="14" fill="#ffffff" stroke="#ced8e5" stroke-width="2.0" />
<rect x="60" y="272" width="14" height="82" rx="7" fill="#d62f3f"/>
<text x="96" y="306" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" fill="#d62f3f" text-anchor="start">BAT+</text>
<text x="240" y="306" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="750" fill="#15243b" text-anchor="start">J2 BAT+   →   R1 BAT+   →   XB2 BAT+</text>
<rect x="60" y="374" width="1780" height="82" rx="14" fill="#ffffff" stroke="#ced8e5" stroke-width="2.0" />
<rect x="60" y="374" width="14" height="82" rx="7" fill="#14a47b"/>
<text x="96" y="408" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" fill="#14a47b" text-anchor="start">A0</text>
<text x="240" y="408" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="750" fill="#15243b" text-anchor="start">U1 D0/A0   →   R1 A0   →   R2 A0</text>
<rect x="60" y="476" width="1780" height="82" rx="14" fill="#ffffff" stroke="#ced8e5" stroke-width="2.0" />
<rect x="60" y="476" width="14" height="82" rx="7" fill="#d946a5"/>
<text x="96" y="510" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" fill="#d946a5" text-anchor="start">D2</text>
<text x="240" y="510" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="750" fill="#15243b" text-anchor="start">U1 D2   →   J1 OUT</text>
<rect x="60" y="578" width="1780" height="82" rx="14" fill="#ffffff" stroke="#ced8e5" stroke-width="2.0" />
<rect x="60" y="578" width="14" height="82" rx="7" fill="#e67620"/>
<text x="96" y="612" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" fill="#e67620" text-anchor="start">D3</text>
<text x="240" y="612" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="750" fill="#15243b" text-anchor="start">U1 D3/PWR   →   J1 +</text>
<text x="60" y="710" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="900" fill="#15243b" text-anchor="start">Unavoidable external factory leads</text>
<text x="86" y="738" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#15243b" text-anchor="start">• LiPo factory lead: MakerHawk battery → meter-verified mating pigtail soldered at J2</text>
<text x="112" y="766" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#5e7187" text-anchor="start">This flexible lead is unavoidable because it is integral to the pouch cell; verify polarity before first connection.</text>
</svg>
