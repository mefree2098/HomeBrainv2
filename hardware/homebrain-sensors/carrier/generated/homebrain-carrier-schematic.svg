<rect x="1160" y="865" width="550" height="175" rx="18" fill="#fff9e9" stroke="#e9b847" stroke-width="3" />
<text x="1188" y="905" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="850" fill="#7a5400" text-anchor="start">CLIMATE BATTERY DIVIDER</text>
<text x="1190" y="950" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="750" fill="#15243b" text-anchor="start">BAT+ ─ R1 200 kΩ ─ A0 ─ R2 200 kΩ ─ GND</text>
<text x="1190" y="990" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650" fill="#6d5b32" text-anchor="start">J6 feeds the battery; J7 carries ± to the XIAO underside pads.</text>
<rect x="90" y="865" width="720" height="175" rx="18" fill="#ffffff" stroke="#c7d2e2" stroke-width="2.0" />
<text x="118" y="905" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="850" fill="#c22f35" text-anchor="start">IMPORTANT</text>
<text x="118" y="950" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#15243b" text-anchor="start">J4 pin 3 MCU-TX goes to the sensor RX pin.</text>
<text x="118" y="988" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#15243b" text-anchor="start">J4 pin 4 MCU-RX comes from the sensor TX pin.</text>
