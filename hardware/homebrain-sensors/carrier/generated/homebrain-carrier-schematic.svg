<rect width="100%" height="100%" fill="#f4f7fb"/>
<text x="60" y="62" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="850" fill="#15243b" text-anchor="start">HOMEBRAIN CARRIER — ELECTRICAL SCHEMATIC</text>
<text x="60" y="100" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="650" fill="#56708d" text-anchor="start">The carrier is passive: sockets, copper fan-out, keyed headers, and the Climate-only 1:2 battery divider.</text>
