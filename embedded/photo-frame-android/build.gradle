// Patch the Android plugin's build-time dependencies until upstream updates them.
// These constraints do not add libraries to the frame APK.
buildscript {
    configurations.classpath {
        resolutionStrategy.eachDependency { dependency ->
            def patched = [
                'com.google.guava:guava': '33.7.2-jre',
                'org.bouncycastle:bcprov-jdk18on': '1.86',
                'org.bouncycastle:bcpkix-jdk18on': '1.86',
                'org.bouncycastle:bcutil-jdk18on': '1.86',
                'org.bitbucket.b_c:jose4j': '0.9.6',
                'org.jdom:jdom2': '2.0.6.1',
                'org.apache.commons:commons-lang3': '3.20.0',
                'org.jetbrains.kotlin:kotlin-gradle-plugin': '2.4.21'
            ]["${dependency.requested.group}:${dependency.requested.name}".toString()]
            if (patched) {
                dependency.useVersion(patched)
                dependency.because('Use patched Android build tooling dependencies')
            }
        }
    }
}

plugins {
    id 'com.android.application' version '9.5.1' apply false
}
