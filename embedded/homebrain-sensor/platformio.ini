[platformio]
default_envs = seeed-xiao-esp32-c6

[env:seeed-xiao-esp32-c6]
; Seeed's platform supplies Arduino-ESP32 3.x support for the ESP32-C6.
; Pin the commit so a future upstream toolchain update cannot silently change builds.
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#c41f41ec51c8cf91550adc8b1487e1b093c8605c
board = seeed-xiao-esp32-c6
framework = arduino
; Keep the Arduino core and its ESP-IDF libraries on the same patched release.
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11.tar.xz
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.11/esp32-core-3.3.11-libs.tar.xz
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions-ota.csv
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D HOMEBRAIN_SENSOR_FIRMWARE_VERSION=\"1.1.0\"
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  bblanchon/ArduinoJson @ 6.21.5
  tzapu/WiFiManager @ 2.0.17
  adafruit/Adafruit BME680 Library @ 2.0.6
  adafruit/Adafruit Unified Sensor @ 1.1.15
  adafruit/Adafruit VEML7700 Library @ 2.1.6
  adafruit/DHT sensor library @ 1.4.7
  sensirion/Sensirion I2C SCD4x @ 1.1.0
  sensirion/Sensirion Core @ 0.7.3
  ncmreynolds/ld2410 @ 0.2.2
