[platformio]
default_envs = elecrow-crowpanel-2_1

[env:elecrow-crowpanel-2_1]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
board_build.partitions = partitions-ota.csv
board_build.embed_files = data/cert/x509_crt_bundle.bin
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:scripts/inject_build_version.py
build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
lib_deps =
  lvgl/lvgl @ ^8.4.0
  adafruit/Adafruit CST8XX Library @ ^1.0.3
  adafruit/Adafruit BusIO @ ^1.16.1
  xreef/PCF8574 library @ ^2.3.4
  bblanchon/ArduinoJson @ ^6.21.5
